<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="greenPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main card -->
  <rect width="800" height="440" rx="16" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="4" rx="0" fill="url(#accent)"/>
  <rect x="0" y="0" width="16" height="16" rx="16" fill="url(#cardBg)"/>
  <rect x="784" y="0" width="16" height="16" rx="16" fill="url(#cardBg)"/>
  <rect x="0" y="0" width="800" height="4" rx="0" fill="url(#accent)" clip-path="inset(0 0 0 0 round 16px 16px 0 0)"/>

  <!-- Window dots -->
  <circle cx="28" cy="24" r="6" fill="#f85149" opacity="0.8"/>
  <circle cx="48" cy="24" r="6" fill="#d29922" opacity="0.8"/>
  <circle cx="68" cy="24" r="6" fill="#3fb950" opacity="0.8"/>

  <!-- Title bar -->
  <text x="400" y="28" text-anchor="middle" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="12">heer_patel_dashboard.py</text>

  <!-- Divider under title -->
  <line x1="16" y1="42" x2="784" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- LEFT COLUMN — Profile Info -->

  <!-- Role card -->
  <rect x="24" y="56" width="360" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="76" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="11">ROLE</text>
  <text x="44" y="98" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">🚀 AI / ML Engineer</text>

  <!-- Status card -->
  <rect x="24" y="120" width="360" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="140" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="11">STATUS</text>
  <rect x="44" y="148" width="140" height="20" rx="10" fill="url(#greenPill)"/>
  <text x="114" y="162" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Open to Work</text>
  <text x="194" y="163" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">SWE · AI/ML Engineer</text>

  <!-- Location card -->
  <rect x="24" y="184" width="360" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="204" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="11">LOCATION</text>
  <text x="44" y="226" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">🌎 Open to relocation</text>

  <!-- Passion card -->
  <rect x="24" y="248" width="360" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="268" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="11">PASSION</text>
  <text x="44" y="290" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Building things that actually work in prod</text>

  <!-- RIGHT COLUMN — Research Interests -->

  <rect x="400" y="56" width="376" height="246" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="420" y="78" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="11">RESEARCH INTERESTS</text>

  <!-- Interest tags as pill badges -->
  <!-- Row 1 -->
  <rect x="420" y="92" width="240" height="26" rx="13" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="109" fill="#58a6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">⚙️ Context Engineering &amp; MCP</text>

  <!-- Row 2 -->
  <rect x="420" y="126" width="250" height="26" rx="13" fill="#8957e5" fill-opacity="0.15" stroke="#8957e5" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="143" fill="#bc8cff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🤖 Multi-Agent Systems &amp; Agentic AI</text>

  <!-- Row 3 -->
  <rect x="420" y="160" width="260" height="26" rx="13" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="177" fill="#56d364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🔍 Semantic Search &amp; Vector Databases</text>

  <!-- Row 4 -->
  <rect x="420" y="194" width="248" height="26" rx="13" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="211" fill="#e3b341" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">📊 Topic Modeling &amp; Drift Detection</text>

  <!-- Row 5 -->
  <rect x="420" y="228" width="268" height="26" rx="13" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="245" fill="#f97583" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🧪 Generative AI Alignment &amp; Evaluation</text>

  <!-- Row 6 -->
  <rect x="420" y="262" width="210" height="26" rx="13" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1" stroke-opacity="0.4"/>
  <text x="435" y="279" fill="#58a6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🏭 Production ML Systems</text>

  <!-- Bottom status bar -->
  <line x1="16" y1="316" x2="784" y2="316" stroke="#21262d" stroke-width="1"/>

  <!-- Metrics row -->
  <!-- Metric 1 -->
  <rect x="24" y="330" width="170" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="109" y="356" text-anchor="middle" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="10">FOCUS AREA</text>
  <text x="109" y="382" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">AI/ML</text>
  <text x="109" y="402" text-anchor="middle" fill="#6e7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Research → Production</text>

  <!-- Metric 2 -->
  <rect x="210" y="330" width="170" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="295" y="356" text-anchor="middle" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="10">COMMITS (PAST YEAR)</text>
  <text x="295" y="384" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">145</text>
  <text x="295" y="402" text-anchor="middle" fill="#6e7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">and counting</text>

  <!-- Metric 3 -->
  <rect x="396" y="330" width="195" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="493" y="356" text-anchor="middle" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="10">TOP ACTIVITY</text>
  <text x="493" y="384" text-anchor="middle" fill="#8957e5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">58%</text>
  <text x="493" y="402" text-anchor="middle" fill="#6e7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Commits · 30% Code Review</text>

  <!-- Metric 4 -->
  <rect x="607" y="330" width="170" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="692" y="356" text-anchor="middle" fill="#8b949e" font-family="SF Mono, Consolas, monospace" font-size="10">AVAILABILITY</text>
  <circle cx="668" cy="380" r="5" fill="#3fb950" filter="url(#glow)"/>
  <text x="706" y="385" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">NOW</text>
  <text x="692" y="402" text-anchor="middle" fill="#6e7681" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Ready to start</text>

</svg>
